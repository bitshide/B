<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Даша</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 30%, #2a1f4d 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #1a3a4a 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #0d0b1a 0%, #05040a 100%);
    background-attachment: fixed;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 16px 70px;
    position: relative;
    overflow-x: hidden;
    color: #d4d0e0;
  }

  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    animation: twinkle 4s infinite ease-in-out;
    z-index: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }

  .bg-heart {
    position: fixed;
    width: 16px;
    height: 16px;
    background: rgba(140, 120, 200, 0.08);
    transform: rotate(-45deg);
    animation: floatUp 25s infinite linear;
    pointer-events: none;
    z-index: 0;
  }
  .bg-heart::before,
  .bg-heart::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: inherit;
    border-radius: 50%;
  }
  .bg-heart::before { top: -8px; left: 0; }
  .bg-heart::after { top: 0; left: 8px; }
  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(-45deg) scale(0.5); opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.3; }
    100% { transform: translateY(-20vh) rotate(-45deg) scale(1); opacity: 0; }
  }

  .container {
    max-width: 540px;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .card {
    background: rgba(18, 16, 30, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(120, 100, 180, 0.25);
    border-radius: 24px;
    padding: 40px 30px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(80, 60, 150, 0.1);
    text-align: center;
  }

  .planet-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6a5acd, #3a2a6a 60%, #1a1030);
    box-shadow: 0 0 30px rgba(106, 90, 205, 0.4), inset -8px -8px 20px rgba(0,0,0,0.5);
    position: relative;
  }
  .planet-icon::after {
    content: '';
    position: absolute;
    top: 50%; left: -12px; right: -12px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(180, 160, 220, 0.6), transparent);
    border-radius: 50%;
    transform: rotate(-15deg);
  }

  h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 2px;
    color: #e8e4f0;
    margin-bottom: 8px;
    font-style: italic;
    text-shadow: 0 0 20px rgba(150, 130, 200, 0.3);
  }

  .subtitle {
    color: rgba(180, 170, 210, 0.6);
    font-size: 13px;
    letter-spacing: 1.5px;
    margin-bottom: 30px;
    text-transform: uppercase;
  }

  .divider {
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(140, 120, 200, 0.6), transparent);
    margin: 20px auto;
  }

  .step {
    display: none;
    animation: fadeIn 0.6s ease-out;
  }
  .step.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-text {
    color: #c8c0e0;
    font-size: 16px;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .options label {
    display: flex;
    align-items: center;
    color: rgba(210, 200, 230, 0.85);
    font-size: 15px;
    cursor: pointer;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(120, 100, 180, 0.2);
    background: rgba(255, 255, 255, 0.03);
    transition: all 0.25s;
    font-family: 'Segoe UI', sans-serif;
    text-align: left;
  }
  .options label:hover {
    background: rgba(120, 100, 180, 0.15);
    border-color: rgba(140, 120, 200, 0.4);
    color: #f0ecf8;
  }

  .options input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border: 1.5px solid rgba(140, 120, 200, 0.5);
    border-radius: 50%;
    margin-right: 12px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }
  .options input[type="radio"]:checked {
    border-color: #8c78c8;
    background: #8c78c8;
    box-shadow: 0 0 10px rgba(140, 120, 200, 0.5);
  }

  .dates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .dates-grid::-webkit-scrollbar { width: 4px; }
  .dates-grid::-webkit-scrollbar-thumb { background: rgba(120, 100, 180, 0.3); border-radius: 4px; }

  .date-option input { display: none; }
  .date-option label {
    display: block;
    text-align: center;
    padding: 8px 4px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(120, 100, 180, 0.2);
    border-radius: 8px;
    color: rgba(200, 190, 220, 0.8);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Segoe UI', sans-serif;
    line-height: 1.3;
  }
  .date-option label:hover {
    background: rgba(120, 100, 180, 0.12);
    border-color: rgba(140, 120, 200, 0.4);
  }
  .date-option input:checked + label {
    background: linear-gradient(135deg, rgba(106, 90, 205, 0.5), rgba(60, 40, 120, 0.6));
    border-color: #8c78c8;
    color: #fff;
    box-shadow: 0 0 14px rgba(106, 90, 205, 0.4);
  }
  .date-option label .day {
    display: block;
    font-size: 9px;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .date-option label .num {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #ddd6ee;
  }

  .btn-wrap {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
  }
  .btn {
    background: linear-gradient(135deg, #6a5acd, #4a3a8a);
    border: none;
    color: #fff;
    padding: 12px 32px;
    border-radius: 25px;
    font-size: 14px;
    font-family: 'Georgia', serif;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(106, 90, 205, 0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(106, 90, 205, 0.5);
  }
  .btn:active { transform: translateY(0); }
  .btn-back {
    background: transparent;
    border: 1px solid rgba(120, 100, 180, 0.3);
    color: rgba(180, 170, 210, 0.7);
    box-shadow: none;
  }
  .btn-back:hover {
    background: rgba(120, 100, 180, 0.1);
    box-shadow: none;
  }

  .final-msg {
    display: none;
    text-align: center;
    animation: fadeIn 0.8s ease-out;
  }
  .final-msg.show { display: block; }

  .final-msg .icon-final {
    width: 48px; height: 48px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid rgba(140, 120, 200, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8c78c8;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(140, 120, 200, 0.2);
  }

  .final-msg p {
    color: #c8c0e0;
    font-size: 16px;
    line-height: 1.7;
    font-style: italic;
  }

  .by-gregory {
    position: fixed;
    bottom: 12px;
    left: 12px;
    color: rgba(160, 150, 190, 0.4);
    font-size: 11px;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
    background: rgba(0, 0, 0, 0.3);
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid rgba(120, 100, 180, 0.15);
    z-index: 100;
    user-select: none;
  }
  .by-gregory::before { content: '\00a9\00a0'; opacity: 0.6; }

  @media (max-width: 480px) {
    .card { padding: 30px 18px; }
    h1 { font-size: 22px; }
    .q-text { font-size: 15px; }
    .options label { font-size: 14px; padding: 10px 12px; }
    .dates-grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
  }
</style>
</head>
<body>

  <div id="stars"></div>
  <div class="bg-heart" style="left: 10%; animation-delay: 0s;"></div>
  <div class="bg-heart" style="left: 30%; animation-delay: 7s; width: 12px; height: 12px;"></div>
  <div class="bg-heart" style="left: 65%; animation-delay: 3s;"></div>
  <div class="bg-heart" style="left: 88%; animation-delay: 12s; width: 14px; height: 14px;"></div>

  <div class="container">
    <div class="card">
      <div class="planet-icon"></div>
      <h1>Даша</h1>
      <p class="subtitle">несколько вопросов</p>

      <div class="divider"></div>

      <form id="dashaForm" action="https://formspree.io/f/mvkzoyeo" method="POST">
        
        <input type="hidden" name="_subject" value="Ответы Даши">
        <input type="hidden" name="Ответы" id="hiddenAnswers" value="">

        <div class="step active" data-step="1">
          <p class="q-text">Что выберешь, если вечер свободен?</p>
          <div class="options">
            <label><input type="radio" name="livni vecher" value="Прогулка по городу"> Прогулка по городу</label>
            <label><input type="radio" name="livni vecher" value="Кофе и болтовня"> Кофе и болтовня</label>
            <label><input type="radio" name="livni vecher" value="Кино"> Кино</label>
            <label><input type="radio" name="livni vecher" value="Что-то активное"> Что-то активное</label>
          </div>
        </div>

        <div class="step" data-step="2">
          <p class="q-text">Как относишься к еде?</p>
          <div class="options">
            <label><input type="radio" name="eda" value="Люблю поесть вкусно"> Люблю поесть вкусно</label>
            <label><input type="radio" name="eda" value="Могу просто кофе"> Могу просто кофе</label>
            <label><input type="radio" name="eda" value="Сладкое — моя слабость"> Сладкое — моя слабость</label>
            <label><input type="radio" name="eda" value="Я не привередлива"> Я не привередлива</label>
          </div>
        </div>

        <div class="step" data-step="3">
          <p class="q-text">Шумно или тихо?</p>
          <div class="options">
            <label><input type="radio" name="shum" value="Толпа, музыка, движ"> Толпа, музыка, движ</label>
            <label><input type="radio" name="shum" value="Тихое место, чтобы поговорить"> Тихое место, чтобы поговорить</label>
            <label><input type="radio" name="shum" value="Всё равно, лишь бы не скучно"> Всё равно, лишь бы не скучно</label>
          </div>
        </div>

        <div class="step" data-step="4">
          <p class="q-text">На улице или в помещении?</p>
          <div class="options">
            <label><input type="radio" name="mesto" value="Гулять, дышать воздухом"> Гулять, дышать воздухом</label>
            <label><input type="radio" name="mesto" value="Внутри, где тепло и уютно"> Внутри, где тепло и уютно</label>
            <label><input type="radio" name="mesto" value="Зависит от погоды"> Зависит от погоды</label>
          </div>
        </div>

        <div class="step" data-step="5">
          <p class="q-text">Что тебя больше радует?</p>
          <div class="options">
            <label><input type="radio" name="radost" value="Вкусная еда"> Вкусная еда</label>
            <label><input type="radio" name="radost" value="Красивые виды"> Красивые виды</label>
            <label><input type="radio" name="radost" value="Смешные моменты"> Смешные моменты</label>
            <label><input type="radio" name="radost" value="Внимание и забота"> Внимание и забота</label>
          </div>
        </div>

        <div class="step" data-step="6">
          <p class="q-text">Вечером ты какая?</p>
          <div class="options">
            <label><input type="radio" name="nastroenie" value="Энергичная, готова на всё"> Энергичная, готова на всё</label>
            <label><input type="radio" name="nastroenie" value="Спокойная, хочу уюта"> Спокойная, хочу уюта</label>
            <label><input type="radio" name="nastroenie" value="Зависит от дня"> Зависит от дня</label>
          </div>
        </div>

        <div class="step" data-step="7">
          <p class="q-text">Когда тебе удобнее встретиться?</p>
          <div class="dates-grid" id="datesGrid"></div>
        </div>

        <div class="step" data-step="8">
          <p class="q-text">И во сколько?</p>
          <div class="options">
            <label><input type="radio" name="vremya" value="День (14:00–17:00)"> День (14:00–17:00)</label>
            <label><input type="radio" name="vremya" value="Вечер (18:00–21:00)"> Вечер (18:00–21:00)</label>
            <label><input type="radio" name="vremya" value="Как получится"> Как получится</label>
          </div>
        </div>

        <div class="btn-wrap" id="btnWrap">
          <button type="button" class="btn btn-back" id="btnBack" style="display:none;" onclick="prevStep()">Назад</button>
          <button type="button" class="btn" id="btnNext" onclick="nextStep()">Далее</button>
        </div>

      </form>

      <div class="final-msg" id="finalMsg">
        <div class="icon-final">✓</div>
        <p>Спасибо. Ждём выбранную дату.</p>
      </div>
    </div>
  </div>

  <div class="by-gregory">by Gregory</div>

<script>
  (function generateStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2 + 0.5;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = (Math.random() * 5) + 's';
      star.style.opacity = Math.random() * 0.5 + 0.1;
      container.appendChild(star);
    }
  })();

  (function generateDates() {
    const grid = document.getElementById('datesGrid');
    const days = ['вс','пн','вт','ср','чт','пт','сб'];
    const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    
    const start = new Date(2026, 9, 30);
    const end = new Date(2026, 10, 30);
    
    let current = new Date(start);
    while (current <= end) {
      const dayName = days[current.getDay()];
      const dayNum = current.getDate();
      const monthName = months[current.getMonth()];
      const value = dayNum + ' ' + monthName;
      
      const div = document.createElement('div');
      div.className = 'date-option';
      const id = 'd' + value.replace(/\s/g, '_');
      div.innerHTML = `
        <input type="radio" name="data" id="${id}" value="${value}">
        <label for="${id}">
          <span class="day">${dayName}</span>
          <span class="num">${dayNum} ${monthName}</span>
        </label>
      `;
      grid.appendChild(div);
      
      current.setDate(current.getDate() + 1);
    }
  })();

  let currentStep = 1;
  const totalSteps = 8;

  function showStep(step) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.querySelector(`.step[data-step="${step}"]`).classList.add('active');
    
    document.getElementById('btnBack').style.display = step > 1 ? 'inline-block' : 'none';
    
    const btnNext = document.getElementById('btnNext');
    if (step === totalSteps) {
      btnNext.textContent = 'Готово';
    } else {
      btnNext.textContent = 'Далее';
    }
  }

  function nextStep() {
    const currentStepEl = document.querySelector(`.step[data-step="${currentStep}"]`);
    const radios = currentStepEl.querySelectorAll('input[type="radio"]');
    if (radios.length > 0) {
      let checked = false;
      radios.forEach(r => { if (r.checked) checked = true; });
      if (!checked) {
        alert('Выбери, пожалуйста, вариант');
        return;
      }
    }

    if (currentStep === totalSteps) {
      submitForm();
    } else {
      currentStep++;
      showStep(currentStep);
    }
  }

  function prevStep() {
    if (currentStep > 1) {
      currentStep--;
      showStep(currentStep);
    }
  }

  function showFinal() {
    document.getElementById('dashaForm').style.display = 'none';
    document.getElementById('btnWrap').style.display = 'none';
    document.getElementById('finalMsg').classList.add('show');
  }

  function submitForm() {
    const form = document.getElementById('dashaForm');
    
    const q1 = document.querySelector('input[name="livni vecher"]:checked')?.value || '';
    const q2 = document.querySelector('input[name="eda"]:checked')?.value || '';
    const q3 = document.querySelector('input[name="shum"]:checked')?.value || '';
    const q4 = document.querySelector('input[name="mesto"]:checked')?.value || '';
    const q5 = document.querySelector('input[name="radost"]:checked')?.value || '';
    const q6 = document.querySelector('input[name="nastroenie"]:checked')?.value || '';
    const date = document.querySelector('input[name="data"]:checked')?.value || '';
    const time = document.querySelector('input[name="vremya"]:checked')?.value || '';
    
    const answersText = `1. ${q1}\n2. ${q2}\n3. ${q3}\n4. ${q4}\n5. ${q5}\n6. ${q6}\nДата: ${date}\nВремя: ${time}`;
    document.getElementById('hiddenAnswers').value = answersText;
    
    const data = new FormData(form);
    
    // Финальный экран показывается сразу, отправка идёт в фоне
    showFinal();
    
    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).catch(() => {});
  }

  showStep(1);
</script>

</body>
</html>
